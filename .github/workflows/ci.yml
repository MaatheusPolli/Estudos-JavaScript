name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes da lógica pura
        run: node --test tests/logic.test.js
      - name: Validação de HTML
        run: npx --yes html-validate@8.29.0 "**/*.html"
