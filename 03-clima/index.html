<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Clima</h1>

    <form class="config">
        <label for="apiKey">Chave da OpenWeather (salva só neste navegador)</label>
        <input type="password" id="apiKey" autocomplete="off" placeholder="Cole sua chave" />
        <button>Salvar chave</button>
    </form>

    <form class="busca">
        <input type="search" id="searchInput" placeholder="Digite o local que deseja" />
        <button>Buscar</button>
    </form>

    <div class="resultado">
        <div class="titulo">--</div>

        <div class="info">
            <div class="temp">
                <div class="tempTitulo">Temperatura</div>
                <div class="tempInfo">-- <sup>ºC</sup></div>
                <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Ícone do tempo" />
            </div>
            <div class="vento">
                <div class="ventoTitulo">Vento</div>
                <div class="ventoInfo">-- <span>km/h</span></div>
                <div class="ventoArea">
                    <div class="ventoPonto" style="transform: rotate(0deg)"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="aviso"></div>

    <script src="script.js"></script>
</body>
</html>
